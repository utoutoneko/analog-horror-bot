name: 毎日のアナログホラー自動投稿

on:
  schedule:
    # UTC基準。日本時間20:00に実行したい場合はUTC 11:00 → "0 11 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch: {}  # 手動実行もできるようにしておく(GitHubのActionsタブから「Run workflow」で試せる)

jobs:
  post-horror-news:
    runs-on: ubuntu-latest

    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
        ports:
          - 50021:50021

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 必要なライブラリをインストール
        run: pip install google-generativeai requests

      - name: VOICEVOXの起動を待つ
        run: |
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:50021/version > /dev/null; then
              echo "VOICEVOX起動確認"
              break
            fi
            echo "待機中... ($i)"
            sleep 2
          done

      - name: スクリプトを実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VOICEVOX_SPEAKER_ID: "3"
        run: python analog_horror_bot.py
